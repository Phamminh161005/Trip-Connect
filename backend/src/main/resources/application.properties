spring.application.name=backend

# Log tiếng Việt hiển thị đúng trên console Windows
logging.charset.console=UTF-8

# Phân trang: không cho client xin quá 100 dòng/trang
spring.data.web.pageable.max-page-size=100

spring.datasource.url=jdbc:postgresql://localhost:5432/tripconnect?options=-c%20timezone=Asia/Ho_Chi_Minh
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu trúc DB do Flyway quản lý (src/main/resources/db/migration). Hibernate chỉ kiểm tra entity khớp bảng.
spring.jpa.hibernate.ddl-auto=validate
# Không giữ kết nối DB mở sau khi service chạy xong -> mọi truy vấn phải nằm trong @Transactional của service
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# DB đã có bảng từ trước khi dùng Flyway -> coi như V1 đã chạy, không tạo lại
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

server.port=8080

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Thời gian chờ tối đa (ms) khi kết nối / đọc / ghi với máy chủ Gmail.
# Không đặt thì mặc định là chờ vô hạn -> máy chủ treo sẽ làm kẹt luồng gửi email.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=${GMAIL_USERNAME}
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

springdotenv.enabled=true

google.client-id=${GOOGLE_CLIENT_ID}

# Lưu trữ file (Cloudinary). Chuỗi dạng cloudinary://<api_key>:<api_secret>@<cloud_name>
cloudinary.url=${CLOUDINARY_URL}

# Giới hạn upload ở tầng web server (chặn file quá lớn trước khi vào tới code)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
